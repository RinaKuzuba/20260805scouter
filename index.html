<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04120A">
<title>スカウター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
<style>
:root{
  --void:#04120A;
  --lens:#8CFFA8;
  --lens-dim:rgba(140,255,168,.34);
  --alert:#FFE45C;
  --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--void);
  font-family:var(--mono);user-select:none;-webkit-user-select:none}

#app{position:fixed;inset:0}

/* ---- camera (mirrored via CSS when front-facing) ---- */
#camwrap{position:absolute;inset:0}
#camwrap.flip{transform:scaleX(-1)}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) sepia(1) hue-rotate(63deg) saturate(3.4) contrast(1.15) brightness(.82)}
#overlay{position:absolute;inset:0;width:100%;height:100%}

/* ---- lens tint + scanlines ---- */
#glass{position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(4,18,10,.34) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(4,18,10,.85) 100%)}

/* ---- readout ---- */
#hud{position:absolute;inset:0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:calc(9vh + env(safe-area-inset-bottom))}

#digits{font-size:clamp(3.2rem,17vw,7rem);line-height:1;font-weight:600;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;
  color:var(--lens);text-shadow:0 0 6px rgba(140,255,168,.65),0 0 26px rgba(140,255,168,.32);
  transform:skewX(-7deg);white-space:nowrap;opacity:0;transition:opacity .18s;
  padding:0 .18em .05em;border-bottom:.05em solid currentColor}
#digits.on{opacity:1}
#digits.rare{color:var(--alert);text-shadow:0 0 8px rgba(255,228,92,.8),0 0 34px rgba(255,228,92,.45)}
#digits.small{font-size:clamp(2rem,10vw,4rem)}

/* ---- rare alarm wash ---- */
#wash{position:absolute;inset:0;pointer-events:none;background:var(--alert);opacity:0}
#wash.fire{animation:flash 1.6s steps(1) 4}
@keyframes flash{0%,49%{opacity:0}50%,99%{opacity:.18}}

/* ---- title ---- */
#title{position:absolute;top:calc(12px + env(safe-area-inset-top));left:0;right:0;
  pointer-events:none;text-align:center}
#title .t1{display:inline-block;color:var(--lens);font-size:clamp(.95rem,4.4vw,1.3rem);
  font-weight:600;letter-spacing:.3em;text-indent:.3em;transform:skewX(-7deg);
  text-shadow:0 0 6px rgba(140,255,168,.55)}
#title .t2{margin-top:4px;color:var(--lens-dim);font-size:.62rem;letter-spacing:.24em;text-indent:.24em}

/* ---- alien glyphs ---- */
#glyphs{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:12px;pointer-events:none;transform:skewX(-5deg)}
#glyphs .col{font-family:"Reggae One",var(--mono);color:rgba(140,255,168,.62);
  font-size:1.05rem;line-height:1.32;letter-spacing:.04em;text-align:center;
  text-shadow:0 0 7px rgba(140,255,168,.4)}
#glyphs.rare .col{color:var(--alert);text-shadow:0 0 8px rgba(255,228,92,.6)}

/* ---- minimal chrome ---- */
#flip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;
  width:44px;height:44px;border:1px solid var(--lens-dim);border-radius:50%;
  background:rgba(4,18,10,.5);color:var(--lens-dim);font-size:1.1rem;
  display:grid;place-items:center;cursor:pointer}
#msg{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  text-align:center;color:var(--lens-dim);font-size:.82rem;letter-spacing:.28em;
  padding:0 24px;line-height:2}

@media (prefers-reduced-motion:reduce){#wash.fire{animation:none;opacity:.18}}
</style>
</head>
<body>
<div id="app">
  <div id="camwrap"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
  <div id="glass"></div>
  <div id="wash"></div>
  <div id="glyphs"></div>
  <div id="title"><span class="t1">酔ッ払イ戦闘力スカウター</span><br><span class="t2">顔ニ向ケテ画面ヲタップ</span></div>
  <div id="hud"><div id="digits">00000000</div></div>
  <div id="msg">起動中</div>
  <div id="flip">⟳</div>
</div>

<script type="module">
/* MediaPipe の読み込み。
   バグ修正: パッケージのルートURLは main フィールド(=CommonJSの .cjs)に解決されるため
   ESM import が失敗する。vision_bundle.mjs を明示する必要がある。 */
const MP = {
  versions: ["1.0.1", "0.10.14"],
  cdns: ["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@",
         "https://unpkg.com/@mediapipe/tasks-vision@"],
  model: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
};
let FilesetResolver=null, FaceDetector=null, wasmBase=null, mpTag='';

async function loadMP(){
  let last;
  for(const v of MP.versions) for(const cdn of MP.cdns){
    const root = cdn + v;
    try{
      const m = await import(root + "/vision_bundle.mjs");
      if(!m.FilesetResolver || !m.FaceDetector) throw new Error('exports missing');
      FilesetResolver=m.FilesetResolver; FaceDetector=m.FaceDetector;
      wasmBase=root+"/wasm"; mpTag=v;
      return;
    }catch(e){ last=e; }
  }
  throw last;
}

/* =======================================================================
   CFG
   [実測] = アップロード画像から算出   [推定] = 未検証。実測後に要調整
   ======================================================================= */
const CFG = {
  BASELINE:      0.3748,      // [実測] 腕の内側 R/(R+G+B)、明るさV=130に補正
  BRIGHT_SLOPE: -0.00033732,  // [実測] 明るさ1あたりの見かけの赤み変化
  REF_V:         130,         // [実測] 補正の基準明るさ
  NOISE_SD:      0.0066,      // [実測] 補正後の残ノイズ（参考値）

  SPAN_NORMAL:   0.030,       // [推定] 戦闘力1200に到達する差分
  SPAN_HIGH:     0.060,       // [推定] 戦闘力9000に到達する差分

  P_MAX: 1200, P_HIGH: 9000, P_SUPER: 530000, P_TOP: 1000000,
  ODDS_SUPER: 0.08, ODDS_TOP: 0.01, ODDS_NULL: 0.03,
  RARE_COOLDOWN_MS: 180000,   // レア後は再抽選を封じる

  FACE_CROP: 0.60, SAMPLE_PX: 32, MIN_CONF: 0.30,
  SCAN_FRAMES: 30, HOLD_MS: 6000,
};

const $=id=>document.getElementById(id);
const fmt=n=>String(n).padStart(8,'0');   // 原作の 00001300 形式
const video=$('video'), overlay=$('overlay'), octx=overlay.getContext('2d');
const digits=$('digits'), msg=$('msg');
const buf=document.createElement('canvas'); buf.width=buf.height=CFG.SAMPLE_PX;
const bctx=buf.getContext('2d',{willReadFrequently:true});
bctx.imageSmoothingEnabled=true; bctx.imageSmoothingQuality='high';

let detector=null, stream=null, facing='user';
let state='boot', win=[], face=null, lastRare=0, holdTimer=null, scrambleTimer=null;
let audio=null, loopStarted=false, diag={det:0,meas:0,frames:0};
let lockAt=0, lastFaceT=0;   // 三角の吸い込みアニメ用

/* ---------------- audio ---------------- */
function tone(f,dur,vol=.08,type='square',delay=0){
  if(!audio) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(audio.destination);
  const t=audio.currentTime+delay;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.setValueAtTime(vol,t+dur-.02); g.gain.linearRampToValueAtTime(0,t+dur);
  o.start(t); o.stop(t+dur+.02);
}
const beepScan =()=>{ for(let i=0;i<5;i++) tone(1500,.045,.05,'square',i*.13); };
const beepLock =()=>{ tone(880,.09,.09); tone(1320,.16,.09,'square',.09); };
const beepRare =()=>{ for(let i=0;i<7;i++){ tone(1750,.11,.11,'sawtooth',i*.19); tone(1180,.11,.09,'sawtooth',i*.19+.09);} };

/* ---------------- init ---------------- */
function bail(code,detail){
  msg.innerHTML = code + '<br><span style="font-size:.7rem;letter-spacing:.1em;opacity:.7">'
    + detail + '</span>';
}

async function init(){
  try{ await loadMP(); }
  catch(e){
    const framed = (()=>{ try{ return window.self!==window.top; }catch(_){ return true; } })();
    return bail('E1 モジュール取得失敗', framed
      ? 'このプレビュー画面は外部CDNを遮断しています。コードに問題はありません。GitHub Pagesに置くか、PCのブラウザで直接開いてください'
      : 'CDNに届いていません。ネット接続を確認してください');
  }

  let fs;
  try{ fs = await FilesetResolver.forVisionTasks(wasmBase); }
  catch(e){ return bail('E2 WASM取得失敗','通信は通っていますがWASMが落ちてきません'); }

  for(const delegate of ["GPU","CPU"]){
    try{
      detector = await FaceDetector.createFromOptions(fs,{
        baseOptions:{ modelAssetPath: MP.model, delegate },
        runningMode:"VIDEO", minDetectionConfidence:CFG.MIN_CONF });
      break;
    }catch(e){ detector=null; }
  }
  if(!detector) return bail('E3 モデル取得失敗','GPU/CPUとも初期化できませんでした');

  await startCam();
}

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
  }catch(e){ msg.textContent='カメラ不可'; return; }
  video.srcObject=stream; await video.play();
  $('camwrap').classList.toggle('flip',facing==='user');
  state='idle'; msg.textContent='';
  if(!loopStarted){ loopStarted=true; requestAnimationFrame(loop); }   // カメラ切替で二重起動しない
  try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
}

/* ---------------- loop ---------------- */
function loop(now){
  requestAnimationFrame(loop);
  if(!detector||video.readyState<2) return;
  if(overlay.width!==video.videoWidth){ overlay.width=video.videoWidth; overlay.height=video.videoHeight; }

  let dets=[]; try{ dets=detector.detectForVideo(video,now).detections||[]; }catch(e){ return; }
  face=centermost(dets);
  if(face){
    const t=performance.now();
    if(t-lastFaceT>350) lockAt=t;   // 350ms以上見失った後の再捕捉で発火（瞬断では再生しない）
    lastFaceT=t;
  }

  octx.clearRect(0,0,overlay.width,overlay.height);
  drawReticle(face);

  if(state==='scanning'){
    diag.frames++; if(face) diag.det++;
    const v=measure(face);
    if(v!==null){ diag.meas++; win.push(v); if(win.length>=CFG.SCAN_FRAMES) finish(); }
  }
}

/* boundingBoxをピクセル座標に正規化して返す。
   実装によっては0〜1の正規化座標が来るため、幅が2以下なら換算する */
function getBox(det){
  const b=det.boundingBox; if(!b) return null;
  if(b.width<=2 && b.height<=2 && video.videoWidth>4)
    return { originX:b.originX*video.videoWidth, originY:b.originY*video.videoHeight,
             width:b.width*video.videoWidth,     height:b.height*video.videoHeight };
  return b;
}

function centermost(d){
  if(!d.length) return null;
  const cx=video.videoWidth/2, cy=video.videoHeight/2;
  let best=null,bd=Infinity;
  for(const x of d){ const b=getBox(x); if(!b) continue;
    const dx=b.originX+b.width/2-cx, dy=b.originY+b.height/2-cy, s=dx*dx+dy*dy;
    if(s<bd){bd=s;best=x;} }
  return best;
}

/* 顔中央60%を32x32へ縮小 → 平均RGB → 明るさ補正つき赤み。
   顔が画面端で切れていても棄却せず、フレーム内にクランプして測る */
function measure(det){
  if(!det) return null;
  const b=getBox(det); if(!b) return null;
  const m=(1-CFG.FACE_CROP)/2;
  let sx=Math.round(b.originX+b.width*m), sy=Math.round(b.originY+b.height*m);
  let sw=Math.round(b.width*CFG.FACE_CROP), sh=Math.round(b.height*CFG.FACE_CROP);
  const x2=Math.min(sx+sw, video.videoWidth), y2=Math.min(sy+sh, video.videoHeight);
  sx=Math.max(0,sx); sy=Math.max(0,sy); sw=x2-sx; sh=y2-sy;
  if(sw<4||sh<4) return null;
  bctx.drawImage(video,sx,sy,sw,sh,0,0,CFG.SAMPLE_PX,CFG.SAMPLE_PX);
  let d; try{ d=bctx.getImageData(0,0,CFG.SAMPLE_PX,CFG.SAMPLE_PX).data; }catch(e){ return null; }
  let R=0,G=0,B=0,n=0;
  for(let i=0;i<d.length;i+=4){ R+=d[i]; G+=d[i+1]; B+=d[i+2]; n++; }
  R/=n; G/=n; B/=n;
  const s=R+G+B; if(s<=0) return null;
  const V=s/3;
  return (R/s) - CFG.BRIGHT_SLOPE*(V-CFG.REF_V);   // 明るさ補正
}

/* ---------------- reticle ---------------- */
function drawReticle(det){
  const W=overlay.width,H=overlay.height;
  let cx=W/2, cy=H/2, r=Math.min(W,H)*0.19;
  if(det){ const b=getBox(det);
    cx=b.originX+b.width/2; cy=b.originY+b.height/2; r=Math.max(b.width,b.height)*0.68; }

  const lw=Math.max(2,W/380);
  const col= det?'rgba(140,255,168,.95)':'rgba(140,255,168,.35)';
  octx.strokeStyle=col; octx.fillStyle=col; octx.lineWidth=lw;

  // 主円
  octx.beginPath(); octx.arc(cx,cy,r,0,Math.PI*2); octx.stroke();
  // 内円（細く薄く）
  octx.save(); octx.globalAlpha=0.45; octx.lineWidth=lw*0.6;
  octx.beginPath(); octx.arc(cx,cy,r*0.55,0,Math.PI*2); octx.stroke(); octx.restore();

  // 上下左右の十字目盛（主円をまたぐ短線）
  const t=r*0.13;
  octx.lineWidth=lw*1.4;
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([ux,uy])=>{
    octx.beginPath();
    octx.moveTo(cx+ux*(r-t), cy+uy*(r-t));
    octx.lineTo(cx+ux*(r+t), cy+uy*(r+t));
    octx.stroke();
  });

  // 円の外側・内向きの三角（ロック時のみ。外から吸い込まれて定位置に着く）
  if(det){
    const p=Math.min(1,(performance.now()-lockAt)/800);
    const e=1-Math.pow(1-p,3);              // ease-out cubic
    const off=r*1.1*(1-e);                  // 開始時は定位置より外
    octx.save(); octx.globalAlpha=0.25+0.75*e;
    const tipR=r*1.07+off, baseR=r*1.30+off, half=r*0.10;
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(([ux,uy])=>{
      const px=-uy, py=ux;   // 進行方向に直交する単位ベクトル
      octx.beginPath();
      octx.moveTo(cx+ux*tipR,           cy+uy*tipR);
      octx.lineTo(cx+ux*baseR+px*half,  cy+uy*baseR+py*half);
      octx.lineTo(cx+ux*baseR-px*half,  cy+uy*baseR-py*half);
      octx.closePath(); octx.fill();
    });
    octx.restore();
  }

  // 走査線（円内にクリップ）
  if(state==='scanning'){
    const y=cy-r+((performance.now()/4)%(r*2));
    octx.save();
    octx.beginPath(); octx.arc(cx,cy,r,0,Math.PI*2); octx.clip();
    octx.strokeStyle='rgba(140,255,168,.6)'; octx.lineWidth=lw;
    octx.beginPath(); octx.moveTo(cx-r,y); octx.lineTo(cx+r,y); octx.stroke();
    octx.restore();
  }
}

/* ---------------- scan ---------------- */
function scan(){
  if(state!=='idle'&&state!=='done') return;
  if(!audio){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(audio&&audio.state==='suspended') audio.resume();
  clearTimeout(holdTimer);
  state='scanning'; win=[]; diag={det:0,meas:0,frames:0}; msg.textContent='';
  digits.className='on'; beepScan();
  scrambleTimer=setInterval(()=>{ digits.textContent=fmt(Math.floor(Math.random()*99999)); },60);
  setTimeout(()=>{ if(state==='scanning') finish(); },6000);   // 顔が取れなくても打ち切り
}

function finish(){
  clearInterval(scrambleTimer);
  if(win.length<3){
    state='done'; digits.className='on small';
    digits.textContent = diag.det===0 ? '対象ヲ検出デキズ' : '測定エラー';
    msg.textContent = `det ${diag.det}/${diag.frames}  meas ${diag.meas}`;   // 原因切り分け用
    holdTimer=setTimeout(()=>{ state='idle'; digits.className=''; msg.textContent=''; },3000);
    return;
  }
  state='done';

  const mean=win.reduce((a,b)=>a+b,0)/win.length;
  const delta=mean-CFG.BASELINE;
  let power, rare=false, label;

  if(delta<=0) power=5;
  else if(delta<CFG.SPAN_NORMAL) power=Math.round(5+(delta/CFG.SPAN_NORMAL)*(CFG.P_MAX-5));
  else if(delta<CFG.SPAN_HIGH)   power=Math.round(CFG.P_MAX+((delta-CFG.SPAN_NORMAL)/(CFG.SPAN_HIGH-CFG.SPAN_NORMAL))*(CFG.P_HIGH-CFG.P_MAX));
  else power=CFG.P_HIGH;

  if(power>=CFG.P_MAX && Date.now()-lastRare>CFG.RARE_COOLDOWN_MS){
    const roll=Math.random();
    if(roll<CFG.ODDS_TOP){ power=CFG.P_TOP; rare=true; }
    else if(roll<CFG.ODDS_TOP+CFG.ODDS_NULL){ label='測定不能'; rare=true; }
    else if(roll<CFG.ODDS_TOP+CFG.ODDS_NULL+CFG.ODDS_SUPER){ power=CFG.P_SUPER; rare=true; }
    if(rare) lastRare=Date.now();
  }

  digits.textContent = label || fmt(power);
  digits.className='on'+(rare?' rare':'')+(label?' small':'');
  if(rare){ beepRare(); glyphFrenzyUntil=Date.now()+2000;
    const w=$('wash'); w.classList.remove('fire'); void w.offsetWidth; w.classList.add('fire'); }
  else beepLock();

  holdTimer=setTimeout(()=>{ state='idle'; digits.className=''; $('wash').classList.remove('fire'); msg.textContent=''; },CFG.HOLD_MS);
}

/* ---------------- input ---------------- */
$('app').addEventListener('pointerdown',e=>{ if(e.target.id==='flip') return; scan(); });
$('flip').addEventListener('pointerdown',e=>{ e.stopPropagation(); facing=facing==='user'?'environment':'user'; startCam(); });

/* 左下の飾りグリフ。
   通常: 350msごとに1文字入替 / スキャン中: 80msごと / レア: 60msで全文字乱れ */
const GLYPH_SET='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
const glyphCols=[];
let glyphFrenzyUntil=0;
{
  const box=$('glyphs');
  const rnd=()=>GLYPH_SET[Math.floor(Math.random()*GLYPH_SET.length)];
  for(const len of [5,4,4]){
    const col=document.createElement('div'); col.className='col';
    const chars=Array.from({length:len},rnd);
    col.innerHTML=chars.join('<br>');
    box.appendChild(col); glyphCols.push({el:col,chars});
  }
  function tick(){
    const frenzy = Date.now()<glyphFrenzyUntil;
    box.classList.toggle('rare',frenzy);
    if(frenzy){
      for(const c of glyphCols){
        c.chars=c.chars.map(rnd);
        c.el.innerHTML=c.chars.join('<br>');
      }
    }else{
      const c=glyphCols[Math.floor(Math.random()*glyphCols.length)];
      c.chars[Math.floor(Math.random()*c.chars.length)]=rnd();
      c.el.innerHTML=c.chars.join('<br>');
    }
    setTimeout(tick, frenzy?60 : state==='scanning'?80 : 350);
  }
  tick();
}

init();
</script>
</body>
</html>
